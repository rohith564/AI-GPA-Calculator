<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/grades.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Grades</title>
</head>

<body>

    <header>
        <div class="logo">
            <i class="fas fa-graduation-cap"></i> AutoGPA
        </div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('calc') }} class=" active">Calculator</a>
        </nav>
        <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </div>
    </header>
    <br><br>
    <center>
        <h3>Grades</h3>

        <hr>
        <br><br>


        <table>
            <thead>
                <td>S.no</td>
                <td>Subject Code</td>
                <td>Grades</td>
                <td>Credits</td>
            </thead>
            <tbody>
                {% for subject in marks %}
                <tr>
                    <td>{{ loop.index }} </td>
                    <td>{{ subject }} </td>
                    <td>{{ marks[subject] }} </td>
                    <td>{{ credits[subject] }} </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>


        <a href="{{ url_for('gpa',marks=marks|tojson, credits=credits|tojson) }}"> <button type="submit">View GPA</button></a>

    </center>
</body>

</html>
